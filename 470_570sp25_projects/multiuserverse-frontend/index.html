<!doctype html>
<html lang="en">

<head>

  <!-- For basic SEO (Search Engine Optimization); 
         NOTE: Please write your own description and keywords to help search engines 
         differentiate your own app from similar sites that are otherwise identical.
         Do NOT go overboard here; Google can "penalize" you for having too many keywords! -->
  <title>MultiUserverse | User Management Dashboard</title>
  <meta name="description" content="BALL" />
  <!-- replace with your own description -->
  <meta name="keywords" content="React, Spring Boot, user management, admin dashboard, nuclear bomb, ball" />

  <meta property="og:description" content="BALL" />
  <meta property="og:image" content="https://multiuserverse-jeplant.netlify.app/og-preview.png" />
